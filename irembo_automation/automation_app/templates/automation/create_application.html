<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New Application - Irembo Automation</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-8">
    <div class="max-w-2xl mx-auto">
        <div class="mb-8">
            <a href="{% url 'dashboard' %}" class="text-emerald-400 hover:text-emerald-300">← Back to Dashboard</a>
            <h1 class="text-4xl font-bold tracking-tight text-emerald-400 mt-4">Create New Application</h1>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-4 rounded-lg bg-red-900/50 border border-red-700 text-slate-100">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="bg-slate-800 rounded-xl shadow-2xl border border-slate-700 overflow-hidden p-6">
            <form method="post" class="space-y-6">
                {% csrf_token %}
                
                <!-- Personal Information Section -->
                <div class="border-b border-slate-700 pb-6">
                    <h2 class="text-lg font-bold text-emerald-400 mb-4">Personal Information</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">First Name *</label>
                            <input type="text" name="first_name" required class="w-full bg-slate-700 border border-slate-600 text-slate-100 px-4 py-2 rounded focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Last Name *</label>
                            <input type="text" name="last_name" required class="w-full bg-slate-700 border border-slate-600 text-slate-100 px-4 py-2 rounded focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">National ID (16 digits) *</label>
                            <input type="text" name="national_id" required pattern="\d{16}" maxlength="16" placeholder="1234567890123456" class="w-full bg-slate-700 border border-slate-600 text-slate-100 px-4 py-2 rounded focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Birth Date *</label>
                            <input type="date" name="birth_date" required class="w-full bg-slate-700 border border-slate-600 text-slate-100 px-4 py-2 rounded focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Phone Number *</label>
                            <input type="text" name="phone_number" required placeholder="0788123456" pattern="07[2389]\d{7}" maxlength="10" class="w-full bg-slate-700 border border-slate-600 text-slate-100 px-4 py-2 rounded focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Email</label>
                            <input type="email" name="email" class="w-full bg-slate-700 border border-slate-600 text-slate-100 px-4 py-2 rounded focus:outline-none focus:border-emerald-500">
                        </div>
                    </div>
                </div>

                <!-- Licensing Information Section -->
                <div class="border-b border-slate-700 pb-6">
                    <h2 class="text-lg font-bold text-emerald-400 mb-4">Licensing Information</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Category (e.g., A, B, B2, C1, D) *</label>
                            <input type="text" name="category" required placeholder="B" class="w-full bg-slate-700 border border-slate-600 text-slate-100 px-4 py-2 rounded focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Provisional Number (for upgrades)</label>
                            <input type="text" name="provisional_number" class="w-full bg-slate-700 border border-slate-600 text-slate-100 px-4 py-2 rounded focus:outline-none focus:border-emerald-500">
                        </div>
                    </div>
                </div>

                <!-- Location & Examination Details Section -->
                <div class="border-b border-slate-700 pb-6">
                    <h2 class="text-lg font-bold text-emerald-400 mb-4">Location & Examination Details</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Akarere (District) *</label>
                            <select name="district" id="districtSelect" onchange="toggleSiteField()" class="w-full bg-slate-700 border border-slate-600 text-slate-100 px-4 py-2 rounded focus:outline-none focus:border-emerald-500">
                                {% for d in districts %}
                                    <option value="{{ d }}" {% if d == 'Kicukiro' %}selected{% endif %}>{{ d }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Itariki (Exam Date)</label>
                            <input type="date" name="exam_date" class="w-full bg-slate-700 border border-slate-600 text-slate-100 px-4 py-2 rounded focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Igihe (Exam Time)</label>
                            <select name="exam_time" class="w-full bg-slate-700 border border-slate-600 text-slate-100 px-4 py-2 rounded focus:outline-none focus:border-emerald-500">
                                <option value="">Select Time Slot (Optional)</option>
                                <option value="8:00 AM - 9:30 AM">8:00 AM - 9:30 AM</option>
                                <option value="9:30 AM - 11:00 AM">9:30 AM - 11:00 AM</option>
                                <option value="11:00 AM - 12:30 PM">11:00 AM - 12:30 PM</option>
                                <option value="2:00 PM - 3:30 PM">2:00 PM - 3:30 PM</option>
                                <option value="3:30 PM - 5:00 PM">3:30 PM - 5:00 PM</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">
                                Aho ikizamini kizabera (Working Site)
                                <span id="siteBadge" class="text-xs text-amber-400 font-normal ml-1">(Kicukiro site selection)</span>
                            </label>
                            <select name="working_site" id="workingSiteInput" class="w-full bg-slate-700 border border-slate-600 text-slate-100 px-4 py-2 rounded focus:outline-none focus:border-emerald-500">
                                <option value="">Select Working Site</option>
                                <option value="BUSANZA AUTOMATED CENTER" selected>BUSANZA AUTOMATED CENTER</option>
                                <option value="KICUKIRO - BUSANZA SITE (KIC)">KICUKIRO - BUSANZA SITE (KIC)</option>
                            </select>
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm font-medium text-slate-300 mb-2">From Teacher</label>
                            <select name="teacher" class="w-full bg-slate-700 border border-slate-600 text-slate-100 px-4 py-2 rounded focus:outline-none focus:border-emerald-500">
                                <option value="none">None (No Teacher)</option>
                                {% for t in teachers %}
                                    <option value="{{ t.id }}">{{ t.name }} {% if t.phone_number %}({{ t.phone_number }}){% endif %}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                <script>
                    function toggleSiteField() {
                        const dist = document.getElementById('districtSelect').value;
                        const siteInput = document.getElementById('workingSiteInput');
                        const siteBadge = document.getElementById('siteBadge');
                        if (dist === 'Kicukiro') {
                            siteInput.disabled = false;
                            siteInput.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-slate-800');
                            siteInput.classList.add('bg-slate-700');
                            siteBadge.style.display = "inline";
                        } else {
                            siteInput.disabled = true;
                            siteInput.value = "";
                            siteInput.classList.add('opacity-50', 'cursor-not-allowed', 'bg-slate-800');
                            siteInput.classList.remove('bg-slate-700');
                            siteBadge.style.display = "none";
                        }
                    }
                    document.addEventListener('DOMContentLoaded', toggleSiteField);
                </script>

                <!-- Payment Information Section -->
                <div class="border-b border-slate-700 pb-6">
                    <h2 class="text-lg font-bold text-emerald-400 mb-4">Payment Status</h2>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Payment Status *</label>
                        <select name="payment_status" required class="w-full bg-slate-700 border border-slate-600 text-slate-100 px-4 py-2 rounded focus:outline-none focus:border-emerald-500">
                            {% for value, label in payment_choices %}
                                <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-4 pt-6">
                    <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3 rounded-lg shadow-lg transition-all">
                        ✓ Create Application
                    </button>
                    <a href="{% url 'dashboard' %}" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold px-6 py-3 rounded-lg shadow-lg transition-all text-center">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
